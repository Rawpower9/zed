# Builds an unsigned macOS bundle of this fork on a GitHub-hosted runner.
#
# This file is written by hand, not generated by `cargo xtask workflows`. It
# exists only for this fork, where Zed's own bundling workflow cannot run
# because it needs Zed's private runners and signing secrets. Leave it out of
# any pull request to zed-industries/zed.
name: fork_bundle_mac
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: 0
on:
  push:
    branches:
    - knowledge-graph-and-harness
  workflow_dispatch:
concurrency:
  group: fork-bundle-mac-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle_mac_aarch64:
    # A standard runner, which is free for public repositories. The `-large`
    # and `-xlarge` variants are billed even there.
    runs-on: macos-26
    # Just under the six-hour limit for a job on a GitHub-hosted runner.
    timeout-minutes: 350
    steps:
    - name: Check out repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: Print toolchain and machine resources
      run: |
        sw_vers
        xcodebuild -version
        xcrun --sdk macosx --show-sdk-version
        echo "cores: $(sysctl -n hw.ncpu)"
        echo "memory bytes: $(sysctl -n hw.memsize)"
        df -h /
    - name: Install the Rust toolchain from rust-toolchain.toml
      run: |
        rustup toolchain install
        rustup show
    - name: Ensure the Metal toolchain is installed
      # Xcode 26 ships the Metal compiler as a separate component, and GPUI's
      # build script needs it to compile shaders.
      run: |
        if ! xcrun metal --version; then
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
        fi
    - name: Build the agent harness
      run: |
        cargo build --release --package agent_harness --target aarch64-apple-darwin
        # Artifacts do not keep the executable bit, so ship the binary in a
        # tarball.
        tar -czf zed-agent-harness-macos-aarch64.tar.gz \
          -C target/aarch64-apple-darwin/release zed-agent-harness
    - name: Upload the agent harness
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-agent-harness-macos-aarch64
        path: zed-agent-harness-macos-aarch64.tar.gz
        if-no-files-found: error
        retention-days: 7
    - name: Bundle Zed
      # Without signing secrets the script signs the app ad hoc and skips
      # notarization and the Sentry upload.
      run: ./script/bundle-mac aarch64-apple-darwin
    - name: Print disk usage after the build
      if: always()
      run: df -h /
    - name: Upload the Zed disk image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-aarch64.dmg
        path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
        if-no-files-found: error
        retention-days: 7
